name: Build macOS .dmg

# 触发方式：
#   1. 手动：仓库 Actions → Build macOS .dmg → Run workflow
#   2. 推送 main 或打 v* tag 自动触发
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

jobs:
  build-macos:
    # macos-13 (Intel) 已于 2025-12-04 退役，钉住它的任务会永远排队。
    # 改用 macos-15 (Apple Silicon) 作为运行机，但**全程用 arch -x86_64 包裹构建**，
    # 让 Python 进程以 x86_64 身份运行（走 Rosetta 2），从而产出 x86_64 包：
    #   - Intel Mac 原生运行
    #   - Apple Silicon Mac 经 Rosetta 2 运行
    # 单个 .dmg 即可覆盖几乎所有 Mac，系统兼容性最强。
    # 注意：actions/setup-python 的 architecture: x64 在 macOS 上是空操作（仍装 arm64 Python），
    # 因此必须在构建命令外再包一层 arch -x86_64，否则会产出 arm64 包（Intel 机报 bad CPU type）。
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rosetta 2 (x86_64 交叉编译必需)
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build x86_64 .dmg (venv+依赖+PyInstaller 全程 arch -x86_64)
        env:
          ATPP_TARGET_ARCH: x86_64
        run: |
          arch -x86_64 bash -c '
            set -e
            python -m pip install --upgrade pip
            pip install -r requirements-macos.txt
            python scripts/package_macos.py --clean
          '

      - name: Verify architecture (必须为 x86_64)
        run: |
          echo "=== 应用二进制架构（应为 x86_64）==="
          lipo -info "release/AT小PP.app/Contents/MacOS/AT小PP" || true
          echo "=== dmg 产物 ==="
          ls -lh release/AT小PP-macos.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AT小PP-macos
          path: release/AT小PP-macos.dmg
          if-no-files-found: error
