name: Build macOS .dmg

# 触发方式：
#   1. 手动：仓库 Actions → Build macOS .dmg → Run workflow
#   2. 推送 main 或打 v* tag 自动触发
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

jobs:
  build-macos:
    # macos-13 (Intel) 已于 2025-12-04 退役，钉住它的任务会永远排队。
    # 改用 macos-15 (Apple Silicon) + Rosetta 2 交叉编译，产出 x86_64 包：
    #   - Intel Mac 原生运行
    #   - Apple Silicon Mac 经 Rosetta 2 运行
    # 单个 .dmg 即可覆盖几乎所有 Mac，系统兼容性最强。
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rosetta 2 (交叉编译 x86_64 必需)
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Set up Python 3.13 (x86_64 版本，经 Rosetta 2 运行)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-macos.txt

      - name: Build .dmg (含免费 ad-hoc 自签名，消除「App 已损坏」类拦截)
        run: python scripts/package_macos.py --clean

      - name: Verify architecture
        run: |
          echo "=== .app 架构（应为 x86_64）==="
          file "release/AT小PP.app/Contents/MacOS/AT小PP" || true
          echo "=== dmg 产物 ==="
          ls -lh release/AT小PP-macos.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AT小PP-macos
          path: release/AT小PP-macos.dmg
          if-no-files-found: error
